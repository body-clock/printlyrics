service: printlyrics
image: body-clock/printlyrics

servers:
  web:
    hosts:
      - 46.225.21.111

proxy:
  ssl: true
  forward_headers: true
  host: printlyrics.app

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "body-clock") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    # Supplied by .kamal/secrets: from the Cloudflare dashboard for a local
    # deploy, from the printlyrics-prod environment secret in the deploy
    # workflow. README.md documents the pair with the site key above.
    - TURNSTILE_SECRET_KEY
  clear:
    RAILS_SERVE_STATIC_FILES: true
    # Public by design — the ID is in the page source. Set from
    # docs/organic-search-operations.md; blank renders no Google tag.
    GA_MEASUREMENT_ID: "G-SECDJWTR8B"
    # Public by design — the Turnstile site key is in the page source. Its
    # secret belongs in .kamal/secrets. The hostnames are the frontend hosts the
    # form accepts tokens for; never localhost or 127.0.0.1 here.
    TURNSTILE_SITE_KEY: "0x4AAAAAAFDv6dP-s2owpzIe"
    TURNSTILE_HOSTNAMES: "printlyrics.app"

volumes:
  - "printlyrics_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  purge: app exec --reuse "bin/rails lyrics:purge_expired"

asset_path: /rails/public/assets

builder:
  arch: amd64
