    new:
      seo:
        title: "Printable Song Lyrics - Find, Edit & Print | PrintLyrics"
        description: "Find lyrics by song or artist, edit every line, fit them into one or two columns, then print or save as PDF. Free with no account required."
      structured_data:
        operating_system: "Any"
        audience: "Musicians, singers, teachers, and listeners"
        features:
          - "Search for lyrics by song title or artist"
          - "Edit lyrics before printing"
          - "Choose one or two columns"
          - "Adjust the print font size"
          - "Print or save as PDF"
      heading: "Find, format, and print song lyrics"
      intro: "Search by song or artist—no copying from another lyrics site. Review the words, fit them on the page, and print or save as PDF. Free, with no account required."
      songbook:
        context_html:
          one: "Adding to a songbook with %{count} song. %{view_link}"
          other: "Adding to a songbook with %{count} songs. %{view_link}"
        view: "View songbook"
      benefits:
        label: "What PrintLyrics does"
        items:
          - "Find the song"
          - "Edit any line"
          - "Fit one or two columns"
          - "Print or save as PDF"
      search:
        heading: "Find song lyrics"
        provider: "via LRCLIB"
        query: "Song title or artist"
        submit: "Search"
        busy: "Searching..."
        loading: "Loading lyrics…"
        results_label: "Song search results"
        close: "Close search results"
        matches_label: "Song matches"
      manual_divider: "or enter lyrics manually"
      form:
        title: "Song title"
        artist: "Artist"
        lyrics: "Lyrics"
        optional: "Optional"
        required: "Required"
        lyrics_placeholder: |-
          [Verse 1]
          First line
          Second line

          [Chorus]
          ...
        submit: "Generate print page"
      explainer:
        eyebrow: "From song to paper"
        heading: "A quicker way to make a readable lyric sheet"
        introduction: "PrintLyrics brings the search, cleanup, layout, and print preview into one short workflow."
        steps:
          find:
            heading: "1. Find or paste the lyrics"
            body: "Search by song title or artist, choose the right recording, or paste lyrics you already have."
          edit:
            heading: "2. Review every word"
            body: "Correct a line, add section labels, or remove notes you do not need before making the print page."
          print:
            heading: "3. Fit the page and print"
            body: "Choose a readable font size and one or two columns, then print directly or save the finished lyric sheet as a PDF."
        use_cases:
          heading: "Made for practical use"
          body: "Create a clear reference sheet for rehearsal, a singer's music stand, a classroom handout, or personal reading without learning a page-layout tool."
        guide_note_html: "Have a song that runs long? The %{guide_link} walks through the order that keeps every line on one sheet."
        guide_link: "one-page printing guide"
      faq:
        eyebrow: "Good to know"
        heading: "Questions about printing song lyrics"
        questions:
          source:
            heading: "Do I need to find and copy the lyrics first?"
            body: "No. Search by song title or artist and PrintLyrics will show available matches from LRCLIB. You can also paste your own text when you already have the words."
          pdf:
            heading: "Can I save the lyric sheet as a PDF?"
            body: "Yes. Open Print, then choose your browser's Save as PDF option instead of a physical printer. The same page layout is used for either choice."
          one_page:
            heading: "How do I fit long lyrics on one page?"
            body: "Try two columns first, then reduce the font size gradually and check print preview. The one-page printing guide explains the most reliable order."
          privacy:
            heading: "Do I need an account?"
            body: "No account is required. Generated sheets use an unlisted share link and remain available for 180 days after their last visit."
      footer:
        retention: "Share links remain available for 180 days after their last visit."
        version: "PrintLyrics version %{version}"
        version_display: "v%{version}"
    show:
      untitled: "Untitled lyrics"
      seo:
        title_with_artist: "%{title} lyrics by %{artist}"
        title_without_artist: "%{title} | PrintLyrics"
        description_with_artist: "Print-friendly lyrics for %{title} by %{artist}."
        description_without_artist: "A clean, print-friendly lyric sheet."
      controls:
        label: "Print page controls"
        back: "Back"
        add_to_songbook: "Add another song"
        print: "Print"
      songbook_prompt:
        message: "%{count} sheets so far — put them in a songbook to print as one job."
        action: "Make a songbook"
        dismiss: "Not now"
      page_count:
        one: "Letter · 0.75 in margins · 1 page"
        other: "Letter · 0.75 in margins · %{count} pages"

  printing_guides:
    one_page:
      seo:
        title: "How to Print Song Lyrics on One Page | PrintLyrics"
        description: "Learn how to fit song lyrics on one page using two columns, readable font sizing, print settings, and preview, then make a clean lyric sheet."
      eyebrow: "A practical printing guide"
      heading: "Print lyrics on one page"
      introduction: "Start with the clearest layout you can read comfortably, then make small adjustments until the print preview fits."
      answer:
        heading: "The short answer"
        body_html: "Use the complete lyrics, switch to two columns, reduce the font only as much as needed, and check the browser's print preview with scale set to 100%. Turn off headers and footers if they take up space. To skip the manual setup, %{tool_link}."
        tool_link: "print your lyrics with PrintLyrics"
      steps:
        complete:
          heading: "Start with the complete lyrics"
          body: "Search for the song or paste your own text. Remove repeated notes or extra blank lines only when they are not useful while playing, teaching, or singing."
        columns:
          heading: "Try two columns"
          body: "Two columns often fit verses and choruses more naturally than one long column. They also reduce the distance your eyes travel across the page."
        font_size:
          heading: "Reduce font size gradually"
          body: "Choose the smallest font size that remains easy to read from where the page will sit. Avoid shrinking everything before trying columns."
        preview:
          heading: "Check print preview"
          body: "Browser and printer margins vary. Open print preview before printing and confirm that the final lines remain on the first sheet."
        print_settings:
          heading: "Keep print settings predictable"
          body: "Start at 100% scale and use the correct paper size, usually US Letter or A4. Turn off browser headers and footers, then adjust margins only if the final lines still spill onto a second page."
      faq:
        eyebrow: "Common problems"
        heading: "One-page lyric printing questions"
        questions:
          columns:
            heading: "Should I use one column or two?"
            body: "Use one column for short songs and two columns for longer lyrics. Two columns usually save more vertical space without making the text uncomfortably small."
          font_size:
            heading: "How small should the lyrics be?"
            body: "Keep the largest size that fits and remains readable from where the paper will sit. For a music stand or classroom, readability matters more than forcing every song onto one sheet."
          overflow:
            heading: "Why does one line still print on page two?"
            body: "Check that the paper size is correct, scale is 100%, and browser headers and footers are off. Printer margins vary, so use print preview before making a final margin adjustment."
      callout:
        heading: "Make your lyric sheet"
        body: "PrintLyrics lets you search or paste lyrics, review the text, choose a size and column layout, and print. No account is required."
        link: "Open the lyric printing tool"

  songbooks:
