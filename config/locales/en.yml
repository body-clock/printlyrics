        other: "Letter · 0.75 in margins · %{count} pages"

  printing_guides:
    one_page:
      seo:
        title: "How to Print Song Lyrics on One Page | PrintLyrics"
        description: "Learn how to fit song lyrics on one page using two columns, readable font sizing, print settings, and preview, then make a clean lyric sheet."
      eyebrow: "A practical printing guide"
      heading: "Print lyrics on one page"
      introduction: "Start with the clearest layout you can read comfortably, then make small adjustments until the print preview fits."
      answer:
        heading: "The short answer"
        body_html: "Use the complete lyrics, switch to two columns, reduce the font only as much as needed, and check the browser's print preview with scale set to 100%. Turn off headers and footers if they take up space. To skip the manual setup, %{tool_link}."
        tool_link: "print your lyrics with PrintLyrics"
      steps:
        complete:
          heading: "Start with the complete lyrics"
          body: "Search for the song or paste your own text. Remove repeated notes or extra blank lines only when they are not useful while playing, teaching, or singing."
        columns:
          heading: "Try two columns"
          body: "Two columns often fit verses and choruses more naturally than one long column. They also reduce the distance your eyes travel across the page."
        font_size:
          heading: "Reduce font size gradually"
          body: "Choose the smallest font size that remains easy to read from where the page will sit. Avoid shrinking everything before trying columns."
        preview:
          heading: "Check print preview"
          body: "Browser and printer margins vary. Open print preview before printing and confirm that the final lines remain on the first sheet."
        print_settings:
          heading: "Keep print settings predictable"
          body: "Start at 100% scale and use the correct paper size, usually US Letter or A4. Turn off browser headers and footers, then adjust margins only if the final lines still spill onto a second page."
      faq:
        eyebrow: "Common problems"
        heading: "One-page lyric printing questions"
        questions:
          template:
            heading: "Do I need a template or a Word document?"
            body: "No. A lyric sheet has no required layout: title and artist at the top, the stanzas in order, then one or two columns at a size you can read from where the sheet will sit. PrintLyrics builds that format for you, so there is no template to download and no page breaks to fix by hand."
          columns:
            heading: "Should I use one column or two?"
            body: "Use one column for short songs and two columns for longer lyrics. Two columns usually save more vertical space without making the text uncomfortably small."
          font_size:
            heading: "How small should the lyrics be?"
            body: "Keep the largest size that fits and remains readable from where the paper will sit. For a music stand or classroom, readability matters more than forcing every song onto one sheet."
          overflow:
            heading: "Why does one line still print on page two?"
            body: "Check that the paper size is correct, scale is 100%, and browser headers and footers are off. Printer margins vary, so use print preview before making a final margin adjustment."
      callout:
        heading: "Make your lyric sheet"
        body: "PrintLyrics lets you search or paste lyrics, review the text, choose a size and column layout, and print. No account is required."
        link: "Open the lyric printing tool"

    songbook:
      seo:
        title: "How to Make and Print a Songbook of Lyrics | PrintLyrics"
        description: "Gather lyric sheets into one songbook and print every song as a single job. Add songs in order, keep each one on its own sheet, and print the set in one go."
      eyebrow: "A practical songbook guide"
      heading: "Make a songbook of lyric sheets"
      introduction: "A songbook, sometimes called a lyric book or booklet, is an ordered set of the sheets you have already made, printed as one job instead of one page at a time."
      answer:
        heading: "The short answer"
        body_html: "Generate a print page for the first song, then add the next song from that page. Once a second sheet exists, PrintLyrics offers to gather the set: each song keeps its own sheet and the set prints in one job. To start from the tool, %{tool_link}."
        tool_link: "print your lyrics with PrintLyrics"
      steps:
        first_sheet:
          heading: "Make the first song's sheet"
          body: "Search for a song or paste your own lyrics, then generate the print page. Set the font size and column count to what you can read comfortably, because the same layout applies to every song in the set."
        add_songs:
          heading: "Add the next song from that page"
          body: "Choose Add another song on a generated sheet and enter the next song. Each song joins the end of the set, so the order you add them in is the order they print in."
        gather:
          heading: "Or gather the sheets you already made"
          body: "A second sheet generated in the same tab brings an offer to collect the sheets that tab already has. Accepting it puts them into one set in the order they were made, without entering any lyrics again."
        order:
          heading: "Check the order before printing"
          body: "The list at the top of the songbook numbers every song in printing order. Moving a song means removing it and adding it again, so the set stays a simple ordered list."
        remove:
          heading: "Remove what does not belong"
          body: "Use the remove button beside a song to drop it from the set. The songs that remain close the gap and keep their order, and the removed sheet still has a page of its own."
        print_all:
          heading: "Print the set as one job"
          body: "Print sends the whole set in a single job, one sheet per song. Set scale to 100%, turn off browser headers and footers, and check the page count in the preview before printing or saving as a PDF."
      faq:
        eyebrow: "Common questions"
        heading: "Songbook printing questions"
        questions:
          count:
            heading: "How many songs can one songbook hold?"
            body: "Up to 25 songs. A songbook becomes a set at its second song, so a songbook holding one song is still a draft sheet rather than a set."
          own_sheet:
            heading: "Does each song print on its own page?"
            body: "Yes. Every song opens a sheet of its own, so two titles never share a page, and a song that runs past one sheet continues onto a plain page."
          add_later:
            heading: "Can I add a song to a songbook later?"
            body: "Yes. Open the songbook and choose Add a song, or use Add another song on any generated sheet. The new song joins the end of the set, and your chosen layout applies to it too."
          word:
            heading: "Can I make a songbook in Word instead?"
            body: "You can, but a document editor leaves you managing page breaks and spacing so that each song starts on its own sheet. A songbook here does that already: every song keeps its sheet, the layout you chose applies to all of them, and the set prints as one job."
          account:
            heading: "Do I need an account, and how long does the songbook last?"
            body: "No account is required. A songbook lives behind an unlisted link and stays available for 180 days after its last visit; opening the set renews every song in it."
      callout:
        heading: "Make your songbook"
        body: "PrintLyrics searches for lyrics or accepts your own text, keeps every song on its own sheet, and prints the set as one job. No account is required."
        link: "Open the lyric printing tool"

